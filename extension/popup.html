<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mergulhe — foco rápido</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 320px;
      background: #061018;
      color: #e7f2f2;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .brand { font-size: 11px; letter-spacing: 0.3em; color: #c4a574; font-weight: 600; }
    .timer-display {
      text-align: center;
      padding: 16px 0;
    }
    .time {
      font-size: 44px;
      font-weight: 200;
      letter-spacing: 0.05em;
      color: #e7f2f2;
    }
    .quote {
      font-size: 12px;
      font-style: italic;
      color: rgba(255,255,255,0.6);
      margin-top: 6px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    button {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: #e7f2f2;
      padding: 8px 4px;
      font-size: 11px;
      letter-spacing: 0.1em;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.2s, border-color 0.2s;
    }
    button:hover {
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.3);
    }
    .btn-main {
      width: 100%;
      padding: 10px;
      border-color: rgba(231,242,242,0.4);
      background: rgba(231,242,242,0.12);
      font-weight: 500;
      margin-bottom: 8px;
    }
    .btn-main:hover {
      background: rgba(231,242,242,0.22);
    }
    .btn-ocean {
      width: 100%;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 6px;
      margin-top: 4px;
    }
    .btn-ocean:hover {
      color: #e7f2f2;
    }
    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
    }
    [hidden] { display: none !important; }
    button:disabled { opacity: .45; cursor: wait; }
    .account { font-size: 11px; color: rgba(255,255,255,.7); overflow-wrap: anywhere; margin-bottom: 10px; }
    .sync-status { font-size: 11px; line-height: 1.5; color: rgba(255,255,255,.6); margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="brand">MERGULHE</span>
    <span id="badge" class="status-badge">Pronto</span>
  </div>

  <p id="account" class="account">Conecte sua conta</p>
  <p id="sync-status" class="sync-status" role="status">Entre com a mesma conta Google usada no celular.</p>
  <button id="btn-login" class="btn-main">Entrar com Google</button>
  <button id="btn-logout" class="btn-ocean" hidden>Sair desta conta</button>

  <div class="timer-display">
    <div id="time" class="time">25:00</div>
    <div id="quote" class="quote">O oceano aguarda sua presença.</div>
  </div>

  <div id="setup-controls" class="grid" hidden>
    <button data-mins="15">15 MIN</button>
    <button data-mins="25">25 MIN</button>
    <button data-mins="45">45 MIN</button>
    <button data-mins="0">SEM TIMER</button>
  </div>

  <div id="active-controls" hidden>
    <button id="btn-pause" class="btn-main">PAUSAR</button>
    <button id="btn-finish" class="btn-main" style="border-color: rgba(255,255,255,0.2); background: transparent;">CONCLUIR SESSÃO</button>
  </div>

  <button id="btn-open-ocean" class="btn-ocean">🌊 Ver o Oceano Completo</button>

  <script type="module" src="generated/popup.js"></script>
</body>
</html>
